openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification for Platform Riset Marketing Konstruksi Indonesia
servers:
  - url: /api
    description: Base API path
tags:
  - name: openrouter
    description: OpenRouter AI chat operations
  - name: health
    description: Health operations
  - name: ebt
    description: Energi Baru Terbarukan — RUPTL projects, IPP pipeline, PLN tenders
  - name: mining
    description: Pertambangan — IUP data, RKAB pipeline, mining projects
  - name: environment
    description: Lingkungan & Transisi Energi — AMDAL, carbon projects, PROPER
  - name: research-items
    description: Research data items
  - name: contractors
    description: Contractor and consultant data
  - name: skk-holders
    description: SKK certification holders
  - name: tender-opportunities
    description: Construction tender opportunities
  - name: pain-points
    description: Pain points and problems collected
  - name: output-products
    description: Output products from Problem Formulation Team
  - name: ai-recommendations
    description: AI product recommendations from Problem Formulation Team
  - name: marketing-strategies
    description: Marketing strategies for fast-moving products
  - name: data-collector
    description: Server-side data fetcher from external sources
  - name: scheduler
    description: Daily data collection scheduler (07:00 WIB)
  - name: dashboard
    description: Dashboard summary and analytics
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: workroom
    description: Shared Workroom analysis notes (shared across team members)
  - name: competitor-signals
    description: Competitor pricing signals collected from IjinTender and other competitor sources

paths:
  /ebt-projects:
    get:
      operationId: listEbtProjects
      tags: [ebt]
      summary: List EBT projects (RUPTL pipeline, IPP)
      parameters:
        - name: teknologi
          in: query
          schema:
            type: string
          description: "Filter by teknologi: PLTS, PLTB, PLTA, PLTM, PLTBG, PLTBm, HYBRID"
        - name: status
          in: query
          schema:
            type: string
          description: "Filter by status: PLANNING, CONSTRUCTION, OPERATIONAL, CANCELLED"
        - name: provinsi
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of EBT projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EbtProject"
    post:
      operationId: createEbtProject
      tags: [ebt]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbtProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbtProject"

  /ebt-projects/{id}:
    get:
      operationId: getEbtProject
      tags: [ebt]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: EBT project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbtProject"
        "404":
          description: Not found
    patch:
      operationId: updateEbtProject
      tags: [ebt]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbtProjectUpdate"
      responses:
        "200":
          description: Updated EBT project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbtProject"
        "404":
          description: Not found

  /ebt-tenders:
    get:
      operationId: listEbtTenders
      tags: [ebt]
      summary: List PLN EBT tenders
      parameters:
        - name: teknologi
          in: query
