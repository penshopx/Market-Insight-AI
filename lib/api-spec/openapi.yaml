      responses:
        "200":
          description: Fetched and parsed data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataFetchResult"

  /data-collector/sources:
    get:
      operationId: listDataSources
      tags: [data-collector]
      summary: List all configured data sources to monitor
      responses:
        "200":
          description: List of data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"

  /scheduler/status:
    get:
      operationId: getSchedulerStatus
      tags: [scheduler]
      summary: Get current scheduler state (last run, next run, running flag)
      responses:
        "200":
          description: Scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStatus"

  /scheduler/trigger:
    post:
      operationId: triggerScheduler
      tags: [scheduler]
      summary: Manually trigger the daily data collection job immediately
      responses:
        "200":
          description: Collection job completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCollectionReport"
        "409":
          description: Job already running

  /scheduler/trigger-source:
    post:
      operationId: triggerSchedulerForSource
      tags: [scheduler]
      summary: Trigger immediate data collection for a single source ID
      parameters:
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Collection job completed for the specified source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCollectionReport"
        "400":
          description: sourceId missing
        "404":
          description: Source not found
        "409":
          description: Job already running

  /scheduler/trigger-empty:
    post:
      operationId: triggerSchedulerForEmptySources
      tags: [scheduler]
      summary: Crawl only sources that have never been crawled
      description: Resolves the current MKR schedule on the server and immediately crawls only sources with no successful crawl history.
      responses:
        "200":
          description: Collection job completed for sources without crawl history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCollectionReport"
        "409":
          description: Job already running
        "500":
          description: Unable to determine crawl history
        "401":
          description: Missing admin authorization
        "403":
          description: Invalid admin authorization
        "503":
          description: Admin authorization is not configured

  /scheduler/runs:
    get:
      operationId: getSchedulerRuns
      tags: [scheduler]
      summary: Get the last 30 scheduler run logs from the database
      responses:
        "200":
          description: List of scheduler run logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerRun"

  /scheduler/runs/{id}/notify:
    post:
      operationId: retryRunNotification
      tags: [scheduler]
      summary: Re-send the collection notification for a specific scheduler run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Notification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerRunNotificationResult"
        "400":
          description: Invalid run ID
        "404":
          description: Run not found

  /scheduler/mkr-schedule:
    get:
      operationId: getMkrCrawlSchedule
      tags: [scheduler]
      summary: Get MKR-aware crawl schedule matrix for all data sources
      responses:
        "200":
          description: Crawl schedule matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MkrCrawlScheduleResponse"

  /mkr/crawl-schedule:
    get:
      operationId: getMkrCrawlScheduleAlias
      tags: [scheduler]
      summary: Get active MKR crawl schedule with lastCrawledAt and nextScheduledAt per source
      responses:
        "200":
          description: Active crawl schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MkrCrawlScheduleResponse"

